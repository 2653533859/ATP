services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - APP_ENV=production
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # External infrastructure can be temporarily unavailable. Keep failures
    # diagnosable instead of restarting this migration-owning container forever.
    restart: on-failure:3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  web-recorder:
    profiles: ["web-recorder"]
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      - APP_ENV=production
      - WEB_RECORDER_MODE=worker
      - WEB_RECORDER_DISPLAY=${WEB_RECORDER_DISPLAY:-:99}
      - WEB_RECORDER_WORKER_ID=${WEB_RECORDER_WORKER_ID:-web-recorder-1}
    command: ["sh", "-c", "Xvfb ${WEB_RECORDER_DISPLAY:-:99} -screen 0 1280x720x24 -nolisten tcp >/tmp/atp-xvfb.log 2>&1 & exec python -m app.web_recording_worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: celery -A app.worker.celery_app flower --port=5555
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
