# ============================================================
# ATP - 3~15人团队轻量版单机 Docker Compose 编排文件 (docker-compose.lite.yml)
#
# 特性:
# 1. 剪裁重型企业监控组件 (移除 Jaeger / Prometheus / Grafana / Exporter);
# 2. 保留完整的: 基础数据库 + 缓存 + 对象存储 + 后端API + 定时任务 + 前端Web;
# 3. 内存消耗压减至 1.5GB ~ 2.5GB，普通 2C4G 或 4C8G 服务器即可流畅运行。
#
# 启动方式:
#   docker compose -f docker-compose.lite.yml --env-file .env.lite up -d
# ============================================================

services:
  # ── 1. 前端 UI (Vue 3 + Nginx) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── 2. 数据库迁移 (Alembic 一次性执行) ────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["migrate"]
    env_file:
      - path: .env.lite
        required: false
      - path: .env
        required: false
    environment:
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

  # ── 3. 后端服务 (FastAPI API Server) ──────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env.lite
        required: false
      - path: .env
        required: false
    environment:
      - APP_ENV=production
    command: ["serve", "--skip-migrations"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── 4. 异步执行 Worker (Celery 用例执行与 AI 生成/诊断) ───
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - path: .env.lite
        required: false
      - path: .env
        required: false
    environment:
      - APP_ENV=production
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-2}
      - CELERY_QUEUES=${CELERY_QUEUES:-default,ai,maintenance}
    command: sh -c "celery -A app.worker.celery_app worker --loglevel=info --pool=solo -Q $${CELERY_QUEUES}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── 5. 定时任务调度器 (Celery Beat) ───────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file:
      - path: .env.lite
        required: false
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── 6. 关系数据库 (PostgreSQL 16) ─────────────────────────
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: .env.lite
        required: false
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atp}
      POSTGRES_USER: ${POSTGRES_USER:-atp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atp_password_change_me}
    volumes:
      - postgres_lite_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atp} -d ${POSTGRES_DB:-atp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── 7. 缓存与队列 Broker (Redis 7) ────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_lite_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── 8. 对象存储 (MinIO - 存储截图与测试证据) ──────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - path: .env.lite
        required: false
      - path: .env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_lite_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_lite_data:
  redis_lite_data:
  minio_lite_data:
