name: atp-performance-acceptance

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.performance-acceptance
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atp_acceptance}
      POSTGRES_USER: ${POSTGRES_USER:-atp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.performance-acceptance}
    volumes:
      - acceptance_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - acceptance_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    env_file: .env.performance-acceptance
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.performance-acceptance}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.performance-acceptance}
    command: server /data
    volumes:
      - acceptance_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.performance-acceptance
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.performance-acceptance
    environment:
      WEB_RECORDER_MODE: worker
      WEB_RECORDER_WORKER_QUEUE_PREFIX: atp:web-recording:commands
    ports:
      - "127.0.0.1:18080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "127.0.0.1:18090:9090"
    volumes:
      - ./deploy/performance-acceptance/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - acceptance_prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # General execution Worker for API/Web cases. Keep it separate from the
  # performance node so Web/API work cannot consume performance capacity.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env.performance-acceptance
    environment:
      CELERY_QUEUES: default,maintenance
      CELERY_CONCURRENCY: "1"
      WORKER_METRICS_PORT: "9091"
      ADB_SCAN_ENABLED: "false"
      PERFORMANCE_NODE_ENABLED: "false"
    command:
      - sh
      - -c
      - exec celery -A app.worker.celery_app worker --loglevel=info --pool=solo -Q "$${CELERY_QUEUES}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Independent Playwright recording Worker. Keep browser sessions out of the
  # API container and route them through the same Redis control plane as the
  # Backend. This service is deliberately separate from Celery execution
  # workers because recording owns long-lived browser state.
  web-recorder:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env.performance-acceptance
    environment:
      APP_ENV: production
      WEB_RECORDER_MODE: worker
      WEB_RECORDER_WORKER_QUEUE_PREFIX: atp:web-recording:commands
      WEB_RECORDER_DISPLAY: :99
      WEB_RECORDER_WORKER_ID: web-recorder-q19-1
      WEB_RECORDER_WORKER_MAX_SESSIONS: "2"
      WEB_RECORDER_HEALTH_FILE: /tmp/atp-web-recorder.ready
    command:
      - sh
      - -c
      - Xvfb $${WEB_RECORDER_DISPLAY:-:99} -screen 0 1280x720x24 -nolisten tcp >/tmp/atp-xvfb.log 2>&1 & exec python -m app.web_recording_worker
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p=os.environ['WEB_RECORDER_HEALTH_FILE']; raise SystemExit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) <= 30 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  acceptance-tls:
    image: alpine:3.20
    volumes:
      - acceptance_tls:/certs
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache openssl
        if [ ! -s /certs/server.crt ] || [ ! -s /certs/server.key ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 7 \
            -keyout /certs/server.key -out /certs/server.crt \
            -subj '/CN=grpc-target' \
            -addext 'subjectAltName=DNS:grpc-target,DNS:localhost,IP:127.0.0.1'
        fi
        chown 10001:10001 /certs/server.crt /certs/server.key
        chmod 644 /certs/server.crt
        chmod 640 /certs/server.key

  acceptance-target:
    build:
      context: .
      dockerfile: deploy/performance-acceptance/Dockerfile.target
    command:
      - --grpc-bind
      - 0.0.0.0
      - --grpc-port
      - "50051"
      - --grpc-certificate
      - /certs/server.crt
      - --grpc-private-key
      - /certs/server.key
      - --http-bind
      - 0.0.0.0
      - --http-port
      - "8080"
    volumes:
      - acceptance_tls:/certs:ro
    networks:
      default:
        aliases:
          - grpc-target
          - http-target
    depends_on:
      acceptance-tls:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), 2).close(); socket.create_connection(('127.0.0.1', 8080), 2).close()"]
      interval: 5s
      timeout: 5s
      retries: 20

  performance-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env.performance-acceptance
    environment:
      CELERY_QUEUES: performance.worker-a
      CELERY_CONCURRENCY: "1"
      WORKER_METRICS_PORT: "9092"
      PERFORMANCE_NODE_ENABLED: "true"
      PERFORMANCE_NODE_ID: worker-a
      PERFORMANCE_NODE_NAME: Acceptance Worker A
      PERFORMANCE_NODE_QUEUE: performance.worker-a
      PERFORMANCE_NODE_MAX_VUS: "20"
      PERFORMANCE_NODE_MAX_CONCURRENCY: "1"
      PERFORMANCE_NODE_EGRESS_ALLOWLIST: grpc-target,http-target
      PERFORMANCE_EXECUTORS: k6,locust,grpc,jmeter
    volumes:
      - acceptance_tls:/etc/atp/tls:ro
    ports:
      - "127.0.0.1:18092:9092"
    command:
      - sh
      - -c
      - |
        queues="$${CELERY_QUEUES:-performance}"
        case ",$${queues}," in
          *,performance,*) ;;
          *) queues="$${queues},performance" ;;
        esac
        exec celery -A app.worker.celery_app worker --loglevel=info --pool=solo -Q "$${queues}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      acceptance-target:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env.performance-acceptance
    environment:
      CELERY_QUEUES: maintenance
      CELERY_CONCURRENCY: "1"
      WORKER_METRICS_PORT: "0"
      ADB_SCAN_ENABLED: "false"
      PERFORMANCE_NODE_ENABLED: "false"
      DB_BACKUP_ENABLED: "true"
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  acceptance-tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: deploy/performance-acceptance/Dockerfile.tools
    env_file: .env.performance-acceptance
    volumes:
      - acceptance_tls:/etc/atp/tls:ro
      - ./docs/evidence:/evidence
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_started
      web-recorder:
        condition: service_healthy
      performance-worker:
        condition: service_started
      acceptance-target:
        condition: service_healthy
      prometheus:
        condition: service_healthy

volumes:
  acceptance_postgres:
  acceptance_redis:
  acceptance_minio:
  acceptance_tls:
  acceptance_prometheus:
