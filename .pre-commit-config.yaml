default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^deploy/helm/atp/templates/
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # 本地密钥扫描：与 CI 的 gitleaks-action 同源，自动复用仓库根 .gitleaks.toml 允许清单。
  # 安装：pre-commit install 后首次运行由 pre-commit 用 go 工具链构建 gitleaks（需本机 go；
  # 无 go 时可 brew install gitleaks 并将本条改为 local system 钩子 entry: gitleaks protect --staged）。
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: backend-ruff-check
        name: backend ruff check
        entry: ruff check backend/app backend/tests
        language: python
        additional_dependencies: [ruff==0.8.4]
        pass_filenames: false
        types_or: [python, pyi]

      - id: backend-ruff-format-check
        name: backend ruff format check
        entry: ruff format --check backend/app backend/tests
        language: python
        additional_dependencies: [ruff==0.8.4]
        pass_filenames: false
        types_or: [python, pyi]

      - id: backend-mypy
        name: backend mypy
        entry: python -m mypy
        language: system
        pass_filenames: false

      - id: frontend-vitest
        name: frontend vitest
        entry: npm --prefix frontend run test
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|vue)$
