default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^deploy/helm/atp/templates/
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # 本地密钥扫描：与 CI 的 gitleaks-action 同源，自动复用仓库根 .gitleaks.toml 允许清单。
  # 安装：pre-commit install 后首次运行由 pre-commit 用 go 工具链构建 gitleaks（需本机 go；
  # 无 go 时可 brew install gitleaks 并将本条改为 local system 钩子 entry: gitleaks protect --staged）。
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: backend-ruff-check
        name: backend ruff check
        entry: ruff check backend/app backend/tests scripts/scaffold-q12-evidence.py scripts/validate-q12-evidence.py scripts/collect-q12-evidence.py scripts/pytest-standalone-sweep.py scripts/validate-deployment-readiness.py scripts/performance-gate.py scripts/performance-environment-smoke.py scripts/performance_acceptance_target.py
        language: python
        additional_dependencies: [ruff==0.8.4]
        pass_filenames: false
        types_or: [python, pyi]

      - id: backend-ruff-format-check
        name: backend ruff format check
        entry: ruff format --check backend/app backend/tests scripts/scaffold-q12-evidence.py scripts/validate-q12-evidence.py scripts/collect-q12-evidence.py scripts/pytest-standalone-sweep.py scripts/validate-deployment-readiness.py scripts/performance-gate.py scripts/performance-environment-smoke.py scripts/performance_acceptance_target.py
        language: python
        additional_dependencies: [ruff==0.8.4]
        pass_filenames: false
        types_or: [python, pyi]

      # 隔离安装而非 language: system：system 钩子会用 PATH 上第一个 python，
      # 真实 git commit 触发时那通常不是项目 venv，钩子会直接崩或用错版本的 mypy。
      #
      # 除 mypy 与两个 stub 包外，还要装被检查代码真正依赖的类型来源。只装 mypy
      # 时它看不到 SQLAlchemy 的真实签名：`d116359^` 的 run_retention.py 只报 8 个
      # 错，而完整环境报 12 个 —— 少掉的 4 条 not_in() arg-type 正是催生这轮门禁
      # 整改的那批错误。补上 sqlalchemy 后与完整环境一致（实测同为 12）。
      # 这些 pin 必须与 backend/requirements*.txt 一致，漂移由
      # backend/tests/test_quality_gate_consistency.py 守住。
      - id: backend-mypy
        name: backend mypy
        entry: mypy
        language: python
        additional_dependencies:
          - mypy==1.14.1
          - types-PyYAML==6.0.12.20250516
          - types-redis==4.6.0.20241004
          - sqlalchemy[asyncio]==2.0.36; python_version < "3.14"
          - sqlalchemy[asyncio]==2.0.51; python_version >= "3.14"
          - fastapi==0.139.0
          - pydantic-settings==2.6.1
        pass_filenames: false

      - id: frontend-vitest
        name: frontend vitest
        entry: npm --prefix frontend run test
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|vue)$
