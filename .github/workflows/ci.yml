name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs on the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run ruff
        run: python -m ruff check backend/app backend/tests

      - name: Run ruff format check
        run: python -m ruff format --check backend/app backend/tests

      - name: Run mypy
        run: python -m mypy

      - name: Run Bandit SAST
        run: python -m bandit -c pyproject.toml -r backend/app -ll

  migration-check:
    name: Empty database migration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atp
          POSTGRES_PASSWORD: atp_password
          POSTGRES_DB: atp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atp -d atp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: atp
      POSTGRES_PASSWORD: atp_password
      POSTGRES_DB: atp
      APP_ENV: test
      APP_SECRET_KEY: ci-secret-key-for-ci-only-padded-to-32-chars
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MINIO_HOST: localhost
      MINIO_PORT: 9000
      MINIO_BUCKET: atp
      WEBHOOK_API_KEY: ci-webhook-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations from empty database
        working-directory: backend
        run: alembic upgrade head

  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atp
          POSTGRES_PASSWORD: atp_password
          POSTGRES_DB: atp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: atp
      POSTGRES_PASSWORD: atp_password
      POSTGRES_DB: atp
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      APP_ENV: test
      APP_SECRET_KEY: ci-secret-key-for-ci-only-padded-to-32-chars
      MINIO_HOST: localhost
      MINIO_PORT: 9000
      MINIO_BUCKET: atp
      WEBHOOK_API_KEY: ci-webhook-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest backend/tests -q --ignore=backend/tests/integration --cov=backend/app --cov-report=xml --cov-report=term-missing:skip-covered --cov-fail-under=52

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-xml
          path: coverage.xml
          if-no-files-found: error

  frontend-check:
    name: Frontend type-check + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          if-no-files-found: error

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
