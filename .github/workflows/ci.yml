name: CI

on:
  # 降低持续运行成本：每周日北京时间 10:00（UTC 02:00）执行一次。
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

# Cancel previous runs on the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # 运行时依赖不是可选的：只装 requirements-dev.txt 时 mypy 看不到 SQLAlchemy
      # 的真实签名，`d116359^` 的 run_retention.py 只报 8 个错而完整环境报 12 个，
      # 少掉的 4 条 not_in() arg-type 正是 2026-07-11 混进 main 的那批。
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run ruff
        run: python -m ruff check backend/app backend/tests scripts/scaffold-q12-evidence.py scripts/validate-q12-evidence.py scripts/collect-q12-evidence.py scripts/pytest-standalone-sweep.py scripts/validate-deployment-readiness.py scripts/validate-android-worker-config.py scripts/performance-gate.py scripts/performance-environment-smoke.py scripts/performance_acceptance_target.py scripts/notification-channel-smoke.py scripts/notification-channel-acceptance.py scripts/web-recording-worker-smoke.py scripts/minio-dataset-acceptance.py scripts/minio-dr-acceptance.py scripts/validate-release-evidence.py

      - name: Run ruff format check
        run: python -m ruff format --check backend/app backend/tests scripts/scaffold-q12-evidence.py scripts/validate-q12-evidence.py scripts/collect-q12-evidence.py scripts/pytest-standalone-sweep.py scripts/validate-deployment-readiness.py scripts/validate-android-worker-config.py scripts/performance-gate.py scripts/performance-environment-smoke.py scripts/performance_acceptance_target.py scripts/notification-channel-smoke.py scripts/notification-channel-acceptance.py scripts/web-recording-worker-smoke.py scripts/minio-dataset-acceptance.py scripts/minio-dr-acceptance.py scripts/validate-release-evidence.py

      - name: Run mypy
        run: python -m mypy

      - name: Run Bandit SAST
        run: python -m bandit -c pyproject.toml -r backend/app -ll

  migration-check:
    name: Empty database migration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atp
          POSTGRES_PASSWORD: atp_password
          POSTGRES_DB: atp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atp -d atp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: atp
      POSTGRES_PASSWORD: atp_password
      POSTGRES_DB: atp
      APP_ENV: test
      APP_SECRET_KEY: ci-secret-key-for-ci-only-padded-to-32-chars
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MINIO_HOST: localhost
      MINIO_PORT: 9000
      MINIO_BUCKET: atp
      WEBHOOK_API_KEY: ci-webhook-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations from empty database
        working-directory: backend
        run: alembic upgrade head

  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atp
          POSTGRES_PASSWORD: atp_password
          POSTGRES_DB: atp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: atp
      POSTGRES_PASSWORD: atp_password
      POSTGRES_DB: atp
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      APP_ENV: test
      APP_SECRET_KEY: ci-secret-key-for-ci-only-padded-to-32-chars
      MINIO_HOST: localhost
      MINIO_PORT: 9000
      MINIO_BUCKET: atp
      WEBHOOK_API_KEY: ci-webhook-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest backend/tests -q --ignore=backend/tests/integration --cov=backend/app --cov-report=xml --cov-report=term-missing:skip-covered --cov-fail-under=82

      # 逐文件跑一遍：整套按序运行会掩盖测试间的隐式耦合（谁先把 backend/ 插进
      # sys.path、谁先补全某个 stub），而 CLAUDE.md 把单文件运行列为文档化入口。
      - name: Run standalone test-file sweep
        run: python scripts/pytest-standalone-sweep.py --jobs 4

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-xml
          path: coverage.xml
          if-no-files-found: error

  # Windows 是文档化的开发平台（docs/windows-local-run.md、scripts/windows-local.ps1），
  # 但在 Q15-03 之前所有 workflow 都只跑 Linux。2026-07-31 第一次在 Windows 上跑全套
  # 就撞出一个仅在该平台失败的用例（fake 用 endswith("scripts/android-network-doctor.sh")
  # 匹配，而生产代码用 pathlib 拼路径，Windows 下是反斜杠），修于 d116359 —— 没有
  # 这个 job 就没人会在 CI 里发现下一个。
  #
  # 范围：只跑后端单元回归。不起 service container（单元套件已 stub 掉
  # postgres/redis/minio），不跑覆盖率门禁（覆盖率在 Linux job 里测一遍即可），
  # 不跑单文件扫描（184 次进程启动在 Windows 上过慢，且它查的是测试间耦合，
  # 与平台无关）。integration 与 E2E 继续只在 Linux 跑，见 docs/ci-workflows.md。
  backend-test-windows:
    name: Backend pytest (Windows)
    runs-on: windows-latest

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-secret-key-for-ci-only-padded-to-32-chars
      WEBHOOK_API_KEY: ci-webhook-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest backend/tests -q --ignore=backend/tests/integration

  frontend-check:
    name: Frontend type-check + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          if-no-files-found: error

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
