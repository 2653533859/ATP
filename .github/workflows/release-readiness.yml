name: Release readiness

on:
  workflow_dispatch:

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker image build checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # buildx + GitHub Actions 层缓存；scope 与 security.yml 的镜像扫描一致，两个 workflow 共用缓存。
      # load 后镜像进入本机 docker，供下面的 docker run 使用。
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          tags: atp-backend:release-readiness
          load: true
          cache-from: type=gha,scope=atp-backend
          cache-to: type=gha,mode=max,scope=atp-backend

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile.worker
          tags: atp-worker:release-readiness
          load: true
          cache-from: type=gha,scope=atp-worker
          cache-to: type=gha,mode=max,scope=atp-worker

      - name: Verify worker k6 binary
        run: docker run --rm --entrypoint k6 atp-worker:release-readiness version

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          tags: atp-frontend:release-readiness
          load: true
          cache-from: type=gha,scope=atp-frontend
          cache-to: type=gha,mode=max,scope=atp-frontend

  release-checklist-contract:
    name: Release checklist contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install contract test dependencies
        run: pip install pytest pyyaml

      - name: Validate release evidence index
        run: python scripts/validate-release-evidence.py --candidate-sha "${{ github.sha }}" --require-candidate-sha --require-clean

      # 契约的唯一定义在 pytest 文件里（普通 CI 同样执行它），
      # 这里直接运行该文件而不是在 YAML 里再抄一份 grep 清单，避免双份漂移。
      - name: Run release checklist contract tests
        run: python -m pytest backend/tests/worker/test_q9_release_readiness.py -q
