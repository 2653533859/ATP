name: Release readiness

on:
  workflow_dispatch:

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker image build checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t atp-backend:release-readiness backend/

      - name: Build worker image
        run: docker build -t atp-worker:release-readiness -f backend/Dockerfile.worker backend/

      - name: Verify worker k6 binary
        run: docker run --rm --entrypoint k6 atp-worker:release-readiness version

      - name: Build frontend image
        run: docker build -t atp-frontend:release-readiness frontend/

  release-checklist-contract:
    name: Release checklist contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install contract test dependencies
        run: pip install pytest pyyaml

      # 契约的唯一定义在 pytest 文件里（普通 CI 同样执行它），
      # 这里直接运行该文件而不是在 YAML 里再抄一份 grep 清单，避免双份漂移。
      - name: Run release checklist contract tests
        run: python -m pytest backend/tests/worker/test_q9_release_readiness.py -q
