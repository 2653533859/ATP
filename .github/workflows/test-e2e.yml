name: CI (e2e)

# P2.4 前端 E2E：Playwright + chromium，mock API 模式（不依赖真后端）。
# 不在 push/PR 上触发——避免阻塞日常 CI；nightly 自动跑 + workflow_dispatch 手动触发。
on:
  workflow_dispatch:
  schedule:
    # 每日 UTC 03:43（北京时间 11:43），与 integration workflow 错开 26 分钟
    - cron: "43 3 * * *"

concurrency:
  group: ci-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-e2e:
    name: Frontend Playwright e2e
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm deps
        run: npm ci

      # Playwright 浏览器下载缓存（~150MB，命中后约 3s vs 30s）
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload playwright-report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
