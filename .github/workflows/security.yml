name: Security

on:
  # 与主 CI 统一为每周日北京时间 10:00（UTC 02:00）执行一次。
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run pip-audit
        run: python -m pip_audit -r backend/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run npm audit
        run: npm --prefix frontend audit --audit-level=high

  # 三个镜像各自独立构建 + 扫描：此前串在同一个 job 里，前一个镜像扫描失败
  # （例如 worker 的内嵌工具漏洞）会让后面的镜像根本不被扫描。
  image-scan:
    name: Trivy image scan (${{ matrix.image }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: worker
            context: backend
            dockerfile: backend/Dockerfile.worker
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 层缓存按镜像分 scope，互不覆盖；load 后镜像进入本机 docker，供 Trivy 扫描。
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: atp-${{ matrix.image }}:security
          load: true
          cache-from: type=gha,scope=atp-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=atp-${{ matrix.image }}

      - name: Scan ${{ matrix.image }} image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: atp-${{ matrix.image }}:security
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
