name: CI (integration)

# P2.3 集成测试：真实 postgres / redis / minio 服务，跑 backend/tests/integration。
# 不在 push/PR 上触发——避免阻塞日常 CI；nightly 自动跑 + workflow_dispatch 手动触发。
on:
  workflow_dispatch:
  schedule:
    # 每日 UTC 03:17（北京时间 11:17），错峰避开 GH runner 早高峰
    - cron: "17 3 * * *"

concurrency:
  group: ci-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atp
          POSTGRES_PASSWORD: atp_password
          POSTGRES_DB: atp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ATP_INTEGRATION_TESTS: "1"
      PYTHONPATH: backend
      APP_ENV: test
      APP_SECRET_KEY: integration-secret-key-padded-to-32-chars-long
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: atp
      POSTGRES_PASSWORD: atp_password
      POSTGRES_DB: atp
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      MINIO_HOST: localhost
      MINIO_PORT: "9000"
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
      MINIO_BUCKET: atp
      WEBHOOK_API_KEY: integration-webhook-key
      FIRST_ADMIN_USERNAME: admin
      FIRST_ADMIN_PASSWORD: Admin@123456
      FIRST_ADMIN_EMAIL: admin@example.com
      RATE_LIMIT_LOGIN: 1000/minute
      # Celery eager：让 trigger 同步返回，避免依赖独立 worker 进程
      CELERY_TASK_ALWAYS_EAGER: "true"
      CELERY_TASK_EAGER_PROPAGATES: "true"
      # 关闭 OTel / 慢查询，减少日志噪声
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      SLOW_QUERY_LOG_ENABLED: "false"
      # 允许 lifespan 兜底 create_all（迁移先跑，create_all 实际是 no-op）
      ALLOW_CREATE_ALL_FALLBACK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest-asyncio

      - name: Start MinIO
        run: |
          docker run -d \
            --name atp-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minio_admin \
            -e MINIO_ROOT_PASSWORD=minio_password \
            minio/minio:RELEASE.2024-11-07T00-52-20Z server /data

      - name: Wait for services
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U atp && break || sleep 2
          done
          for i in {1..30}; do
            redis-cli -h localhost ping && break || sleep 2
          done
          for i in {1..30}; do
            curl -sf http://localhost:9000/minio/health/live && break || sleep 2
          done

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run integration tests
        run: pytest backend/tests/integration -m integration -v --tb=short
