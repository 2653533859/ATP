apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atp.fullname" . }}-worker
  labels:
    {{- include "atp.componentLabels" (dict "Chart" .Chart "Release" .Release "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.worker }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}/worker:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command: ["sh", "-c", "celery -A app.worker.celery_app worker --loglevel=info --pool=solo -Q ${CELERY_QUEUES:-default,ios,ai,maintenance,performance}"]
          envFrom:
            - configMapRef:
                name: {{ include "atp.fullname" . }}-config
            - secretRef:
                name: {{ include "atp.secretName" . }}
          # Worker 进程独立的 Prometheus /metrics 端点（与 backend:8000/metrics 区分）
          # 通过 WORKER_METRICS_PORT 配置；多 worker 子进程共享物理端口
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort | default 9091 }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
