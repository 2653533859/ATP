apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atp.fullname" . }}-worker
  labels:
    {{- include "atp.componentLabels" (dict "Chart" .Chart "Release" .Release "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.worker }}
  {{- if .Values.podNetwork.hostNetwork }}
  # 指标端口需要在创建替代 Pod 前释放。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
      maxSurge: 0
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "atp.podNetwork" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}/worker:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command:
            - sh
            - -c
            - exec /usr/bin/tini -- celery -A app.worker.celery_app worker --hostname="worker@${POD_NAMESPACE}.${POD_NAME}" --loglevel=info --pool=solo -Q "${CELERY_QUEUES:-default,ios,ai,maintenance,performance}"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: {{ include "atp.fullname" . }}-config
            - secretRef:
                name: {{ include "atp.secretName" . }}
          # Worker 进程独立的 Prometheus /metrics 端点（与 backend:8000/metrics 区分）
          # 通过 WORKER_METRICS_PORT 配置；多 worker 子进程共享物理端口
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort | default 9091 }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
