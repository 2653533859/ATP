{{- if and .Values.performanceWorker.enabled (gt (int .Values.performanceWorker.metricsPort) 0) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "atp.fullname" . }}-performance-worker
  labels:
    {{- include "atp.componentLabels" (dict "Chart" .Chart "Release" .Release "component" "performance-worker") | nindent 4 }}
spec:
  type: {{ .Values.service.performanceWorker.type }}
  ports:
    - port: {{ .Values.service.performanceWorker.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: performance-worker
{{- end }}
