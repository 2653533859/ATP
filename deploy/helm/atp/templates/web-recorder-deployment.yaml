{{- if .Values.webRecorder.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atp.fullname" . }}-web-recorder
  labels:
    {{- include "atp.componentLabels" (dict "Chart" .Chart "Release" .Release "component" "web-recorder") | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.webRecorder }}
  {{- if .Values.podNetwork.hostNetwork }}
  # X11 abstract sockets share the host network namespace. Release the old
  # display before starting a replacement Pod on a single-node installation.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
      maxSurge: 0
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web-recorder
  template:
    metadata:
      annotations:
        {{- include "atp.podConfigAnnotations" . | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web-recorder
    spec:
      {{- include "atp.podNetwork" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web-recorder
          image: "{{ .Values.image.repository }}/worker:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command: ["/usr/bin/tini", "--", "sh", "-c"]
          args:
            - |
              configured_display="${WEB_RECORDER_DISPLAY:-:99}"
              base_display_number="${configured_display#:}"
              case "${base_display_number}" in
                ''|*[!0-9]*) echo "WEB_RECORDER_DISPLAY must use the form :N" >&2; exit 1 ;;
              esac
              mkdir -p /tmp/.X11-unix
              ready=0
              for display_offset in $(seq 0 10); do
                display_number=$((base_display_number + display_offset))
                display=":${display_number}"
                rm -f "/tmp/.X${display_number}-lock" "/tmp/.X11-unix/X${display_number}"
                Xvfb "${display}" -screen 0 1280x720x24 -nolisten tcp >/tmp/atp-xvfb.log 2>&1 &
                xvfb_pid=$!
                for _attempt in $(seq 1 50); do
                  if [ -S "/tmp/.X11-unix/X${display_number}" ] && kill -0 "${xvfb_pid}" 2>/dev/null; then
                    ready=1
                    break
                  fi
                  if ! kill -0 "${xvfb_pid}" 2>/dev/null; then
                    wait "${xvfb_pid}" 2>/dev/null || true
                    break
                  fi
                  sleep 0.1
                done
                if [ "${ready}" -eq 1 ]; then
                  break
                fi
              done
              if [ "${ready}" -ne 1 ]; then
                cat /tmp/atp-xvfb.log >&2
                echo "Xvfb could not claim a display from ${configured_display}" >&2
                exit 1
              fi
              export WEB_RECORDER_DISPLAY="${display}"
              exec python -m app.web_recording_worker
          envFrom:
            - configMapRef:
                name: {{ include "atp.fullname" . }}-config
            - secretRef:
                name: {{ include "atp.secretName" . }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WEB_RECORDER_MODE
              value: "worker"
            - name: WEB_RECORDER_WORKER_ID
              value: {{ printf "%s-$(POD_NAME)" .Values.webRecorder.workerId | quote }}
            - name: WEB_RECORDER_DISPLAY
              value: {{ .Values.webRecorder.display | quote }}
            - name: WEB_RECORDER_WORKER_MAX_SESSIONS
              value: {{ .Values.webRecorder.maxSessions | quote }}
            - name: WEB_RECORDER_WORKER_HEARTBEAT_SECONDS
              value: {{ .Values.webRecorder.heartbeatSeconds | quote }}
            - name: WEB_RECORDER_WORKER_TTL_SECONDS
              value: {{ .Values.webRecorder.workerTtlSeconds | quote }}
            - name: WEB_RECORDER_HEALTH_FILE
              value: {{ .Values.webRecorder.healthFile | quote }}
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os,time; p=os.environ['WEB_RECORDER_HEALTH_FILE'];
                  raise SystemExit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) <= 30 else 1)
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os,time; p=os.environ['WEB_RECORDER_HEALTH_FILE'];
                  raise SystemExit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) <= 30 else 1)
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.webRecorder.resources | nindent 12 }}
{{- end }}
