{{- if .Values.storageLifecycle.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "atp.fullname" . }}-minio-lifecycle
  labels:
    {{- include "atp.componentLabels" (dict "Chart" .Chart "Release" .Release "component" "minio-lifecycle") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: minio-lifecycle
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: {{ default (printf "%s/backend:%s" .Values.image.repository .Values.image.backend.tag) .Values.storageLifecycle.jobImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.ops_minio_lifecycle"]
          env:
            - name: MINIO_LIFECYCLE_APPLY
              value: "true"
            - name: MINIO_LIFECYCLE_ABORT_INCOMPLETE_DAYS
              value: {{ .Values.storageLifecycle.abortIncompleteMultipartDays | quote }}
            - name: MINIO_LIFECYCLE_EXPIRATION_RULES_JSON
              value: {{ .Values.storageLifecycle.expirationRules | toJson | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "atp.fullname" . }}-config
            - secretRef:
                name: {{ include "atp.secretName" . }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}
