{{- if .Values.performanceWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atp.fullname" . }}-performance-worker
  labels:
    {{- include "atp.componentLabels" (dict "Chart" .Chart "Release" .Release "component" "performance-worker") | nindent 4 }}
spec:
  replicas: {{ .Values.performanceWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: performance-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: performance-worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: performance-worker
          image: "{{ .Values.image.repository }}/worker:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command: ["sh", "-c", "celery -A app.worker.celery_app worker --loglevel=info --pool=solo -Q ${CELERY_QUEUES:-performance}"]
          envFrom:
            - configMapRef:
                name: {{ include "atp.fullname" . }}-config
            - secretRef:
                name: {{ include "atp.fullname" . }}-secret
          env:
            - name: CELERY_QUEUES
              value: {{ .Values.performanceWorker.queues | quote }}
            - name: CELERY_CONCURRENCY
              value: {{ .Values.performanceWorker.concurrency | quote }}
            - name: WORKER_METRICS_PORT
              value: {{ .Values.performanceWorker.metricsPort | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.performanceWorker.metricsPort | default 9092 }}
              protocol: TCP
          resources:
            {{- toYaml .Values.performanceWorker.resources | nindent 12 }}
{{- end }}
