{{- if .Values.performanceWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atp.fullname" . }}-performance-worker
  labels:
    {{- include "atp.componentLabels" (dict "Chart" .Chart "Release" .Release "component" "performance-worker") | nindent 4 }}
spec:
  replicas: {{ .Values.performanceWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: performance-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: performance-worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.performanceWorker.spreadAcrossNodes }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ .Chart.Name }}
                  app.kubernetes.io/instance: {{ .Release.Name }}
                  app.kubernetes.io/component: performance-worker
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: performance-worker
          image: "{{ .Values.image.repository }}/worker:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command:
            - sh
            - -c
            - |
              if [ "{{ .Values.performanceWorker.autoIdentity }}" = "true" ]; then
                export PERFORMANCE_NODE_ID="${HOSTNAME}"
                export PERFORMANCE_NODE_NAME="${PERFORMANCE_NODE_NAME:-${HOSTNAME}}"
                export PERFORMANCE_NODE_QUEUE="performance.${HOSTNAME}"
                queues="${PERFORMANCE_NODE_QUEUE}"
              else
                queues="${CELERY_QUEUES:-performance}"
                case ",${queues}," in
                  *,performance,*) ;;
                  *) queues="${queues},performance" ;;
                esac
              fi
              exec celery -A app.worker.celery_app worker --loglevel=info --pool=solo -Q "${queues}"
          envFrom:
            - configMapRef:
                name: {{ include "atp.fullname" . }}-config
            - secretRef:
                name: {{ include "atp.secretName" . }}
          env:
            - name: CELERY_QUEUES
              value: {{ .Values.performanceWorker.queues | quote }}
            - name: CELERY_CONCURRENCY
              value: {{ .Values.performanceWorker.concurrency | quote }}
            - name: WORKER_METRICS_PORT
              value: {{ .Values.performanceWorker.metricsPort | quote }}
            - name: PERFORMANCE_NODE_ENABLED
              value: {{ .Values.performanceWorker.nodeEnabled | quote }}
            - name: PERFORMANCE_NODE_ID
              value: {{ .Values.performanceWorker.nodeId | quote }}
            - name: PERFORMANCE_NODE_NAME
              value: {{ .Values.performanceWorker.nodeName | quote }}
            - name: PERFORMANCE_NODE_QUEUE
              value: {{ .Values.performanceWorker.nodeQueue | quote }}
            - name: PERFORMANCE_NODE_MAX_VUS
              value: {{ .Values.performanceWorker.nodeMaxVus | quote }}
            - name: PERFORMANCE_NODE_MAX_CONCURRENCY
              value: {{ .Values.performanceWorker.nodeMaxConcurrency | quote }}
            - name: PERFORMANCE_NODE_EGRESS_ALLOWLIST
              value: {{ .Values.performanceWorker.nodeEgressAllowlist | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.performanceWorker.metricsPort | default 9092 }}
              protocol: TCP
          {{ if gt (int (.Values.performanceWorker.metricsPort | default 9092)) 0 }}
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          {{ end }}
          resources:
            {{- toYaml .Values.performanceWorker.resources | nindent 12 }}
{{- end }}
