global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: atp-backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  - job_name: atp-worker
    static_configs:
      - targets: ["worker:9091"]
    metrics_path: /metrics

  - job_name: atp-performance-worker
    static_configs:
      - targets: ["performance-worker:9092"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
