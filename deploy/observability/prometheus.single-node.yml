global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/atp.rules.yml

scrape_configs:
  - job_name: atp-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: atp-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: atp-performance-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9092"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
