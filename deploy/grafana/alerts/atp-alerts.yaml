apiVersion: 1

groups:
  - orgId: 1
    name: atp-platform-alerts
    folder: ATP
    interval: 1m
    rules:
      - uid: atp-api-error-rate
        title: ATP API error rate is high
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: ATP API 5xx error rate is above 5%.
          description: Backend /metrics reports elevated 5xx responses over the last five minutes.
          runbook_url: docs/observability-guide.md
        labels:
          severity: warning
          service: atp-backend
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: |
                sum(rate(http_requests_total{status=~"5.."}[5m]))
                /
                clamp_min(sum(rate(http_requests_total[5m])), 1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.05]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: atp-worker-queue-backlog
        title: ATP worker queue backlog is high
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Celery queue length is above 100 for 10 minutes.
          description: Worker capacity may be insufficient or tasks may be stuck.
          runbook_url: docs/observability-guide.md
        labels:
          severity: warning
          service: atp-worker
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: max(celery_queue_length)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [100]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: atp-db-connections-near-limit
        title: ATP database connections are near limit
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: PostgreSQL connections are above 80% of max_connections.
          description: Database connection pool pressure may affect API and worker availability.
          runbook_url: docs/disaster-recovery.md
        labels:
          severity: warning
          service: postgres
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: |
                sum(pg_stat_activity_count)
                /
                clamp_min(sum(pg_settings_max_connections), 1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.8]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: atp-celery-failure-rate
        title: ATP Celery failure rate is high
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Celery task failures are being reported.
          description: Check worker logs, task retries, and external dependencies.
          runbook_url: docs/observability-guide.md
        labels:
          severity: warning
          service: atp-worker
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(celery_task_failed_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

      - uid: atp-run-timeouts
        title: ATP run timeout rate is high
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: ATP run or Celery task timeouts are increasing.
          description: Investigate slow tests, browser/device availability, and worker resource limits.
          runbook_url: docs/observability-guide.md
        labels:
          severity: warning
          service: atp-worker
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(atp_celery_timeouts_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
