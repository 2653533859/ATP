<!doctype html>

      <a id="atp-download-link" href="/atp-windows-smoke.txt" download="atp-windows-smoke.txt">
        下载 Windows 冒烟文件

    <script>
      document.getElementById('atp-download-link').addEventListener('click', () => {

</html>
