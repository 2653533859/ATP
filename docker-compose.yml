services:
  # ── 前端 ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── 后端 API ─────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file: .env
    environment:
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - APP_ENV=production
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - OTEL_SERVICE_NAME=atp-backend
      - JAEGER_UI_URL=${JAEGER_UI_URL:-http://localhost:16686}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── Mock Server 独立端口（P1.3，可选）────────────
  # 启用：docker compose --profile mock-standalone up -d mock-standalone
  # 暴露：http://localhost:${MOCK_STANDALONE_PORT:-18000}/{project_id}/{path}
  mock-standalone:
    profiles: ["mock-standalone"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - uvicorn
      - app.mock_main:app
      - --host
      - 0.0.0.0
      - --port
      - "18000"
    env_file: .env
    environment:
      - APP_ENV=production
      - OTEL_SERVICE_NAME=atp-mock
    ports:
      - "${MOCK_STANDALONE_PORT:-18000}:18000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Worker ────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
      - CELERY_QUEUES=${CELERY_QUEUES:-default,android,mobile_special,ios,ai,maintenance,performance}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - OTEL_SERVICE_NAME=atp-worker
      - WORKER_METRICS_PORT=${WORKER_METRICS_PORT:-9091}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "celery -A app.worker.celery_app worker --loglevel=info --pool=solo -Q $${CELERY_QUEUES}"
    # 暴露 worker 进程 Prometheus /metrics 端点（与 backend:8000/metrics 区分）
    # 多 worker 子进程共享同一物理端口；首个子进程成功绑定后其余 OSError 静默
    expose:
      - "9091"
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  web-recorder:
    profiles: ["web-recorder"]
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      - APP_ENV=production
      - WEB_RECORDER_MODE=worker
      - WEB_RECORDER_DISPLAY=${WEB_RECORDER_DISPLAY:-:99}
      - WEB_RECORDER_WORKER_ID=${WEB_RECORDER_WORKER_ID:-web-recorder-1}
      - WEB_RECORDER_HEALTH_FILE=${WEB_RECORDER_HEALTH_FILE:-/tmp/atp-web-recorder.ready}
    command: ["sh", "-c", "Xvfb ${WEB_RECORDER_DISPLAY:-:99} -screen 0 1280x720x24 -nolisten tcp >/tmp/atp-xvfb.log 2>&1 & exec python -m app.web_recording_worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p=os.environ['WEB_RECORDER_HEALTH_FILE']; raise SystemExit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) <= 30 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped
    # Android 真机联调建议：
    # 1. 直连模式：宿主机先执行 `adb tcpip 5555`，worker 再独立 `adb connect <device-ip>:5555`
    # 2. 共享模式：设置 ADB_SERVER_SOCKET=tcp:host.docker.internal:5037，并安全暴露宿主 ADB server
    # 3. Flower 使用宿主 5555；不要把 host.docker.internal:5555 当作 ADB server

  # ── Celery Beat（定时任务）────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Flower（任务监控）─────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: celery -A app.worker.celery_app flower --port=5555
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── MinIO（对象存储）─────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9001:9001"   # MinIO 控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Jaeger（OpenTelemetry 链路追踪 UI + Collector）─
  jaeger:
    image: jaegertracing/all-in-one:1.62
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
    restart: unless-stopped

  # ── Prometheus（metrics 采集，profile observability）──
  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ── Grafana（metrics 可视化，profile observability）──
  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── Celery Exporter（订阅 Redis broker，profile observability）──
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    profiles: ["observability"]
    environment:
      - CE_BROKER_URL=redis://redis:6379/0
    ports:
      - "9808:9808"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
